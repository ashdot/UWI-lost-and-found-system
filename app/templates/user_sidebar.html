<div class="user-sidebar">

    <!-- Logo / Branding -->
    <div class="sidebar-top">
        <h2 class="logo">
            UWI <span>Lost</span><br>&amp; Found
        </h2>
    </div>

    <!-- Navigation -->
    <div class="user-menu">

        <p class="menu-label">MENU</p>

        <!-- Standard Dashboard Link -->
        <a 
            href="{{ url_for('views_bp.dashboard') }}"
            class="menu-item {% if active_page == 'dashboard' %}active{% endif %}"
        >
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
        </a>

        <!-- Admin-Only Links -->
        {% if current_user.role == 'admin' %}
        <p class="menu-label mt-4">ADMIN TOOLS</p>

        <a 
            href="{{ url_for('views_bp.report_found') }}"
            class="menu-item {% if active_page == 'report_found' %}active{% endif %}"
        >
            <i class="bi bi-plus-circle-fill" style="color: var(--teal);"></i>
            <span>Report Found Item</span>
        </a>

        <a 
            href="{{ url_for('views_bp.manage_claims') }}"
            class="menu-item {% if active_page == 'manage_claims' %}active{% endif %}"
        >
            <i class="bi bi-shield-check" style="color: var(--amber);"></i>
            <span>Claim Management</span>
        </a>
        {% endif %}

        <!-- Regular User Links (Optional: Wrap in else if you want to hide from Admin) -->
        <p class="menu-label mt-4">REPORTS</p>
        <a 
            href="{{ url_for('views_bp.report_lost') }}"
            class="menu-item {% if active_page == 'report' %}active{% endif %}"
        >
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>Report Lost Item</span>
        </a>

    </div>

    <!-- Bottom Section -->
    <div class="sidebar-bottom">
        <a 
            href="{{ url_for('auth_bp.logout') }}"
            class="menu-item logout"
        >
            <i class="bi bi-box-arrow-right"></i>
            <span>Sign Out</span>
        </a>
    </div>

</div>
