<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UWI FindIt</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Google Fonts -->
    <!-- Google Fonts: Includes Syne, DM Sans, Lexend, Figtree, and Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=Lexend:wght@400;700&family=Figtree:wght@400;600&family=Outfit:wght@400;700&display=swap&family=Bricolage+Grotesque:wght@700&family=Inter:wght@400;600" rel="stylesheet"/>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    
    <!-- Specific Style Sheets-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notif.css') }}">
    {% block css %} {% endblock %}
</head>
<body>
    <main>
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-primary text-white">
                    <strong class="me-auto">UWI Lost & Found</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toastBody"></div>
            </div>
        </div>

        <div class="container-fluid p-0">
            {% block main %}{% endblock %}
        </div>
    </main>

    <!-- 1. DATA: Jinja dumps messages here once -->
    <div id="flash-messages" style="display: none;">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-data" data-message="{{ message|safe }}"></div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

    <!-- 2. LOGIC: Pure JavaScript reads the data above -->
    <script>
        function showToast(message) {
            const toastElement = document.getElementById('liveToast');
            const toastBody = document.getElementById('toastBody');
            if (toastElement && toastBody) {
                toastBody.innerText = message;
                const toast = new bootstrap.Toast(toastElement);
                toast.show();
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const messageElements = document.querySelectorAll('.flash-data');
            messageElements.forEach((el, index) => {
                const msg = el.getAttribute('data-message');
                setTimeout(() => {
                    showToast(msg);
                }, index * 500);
            });
        });
    </script>

    {% block js %} {% endblock %}
</body>
</html>
